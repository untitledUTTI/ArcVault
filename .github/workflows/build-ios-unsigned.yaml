name: 'build-ios-unsigned'

on:
  workflow_dispatch:

jobs:
  build-ios:
    # 关键：使用 macos-15 以确保 Xcode 16+
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          # 显式选择最新的 Xcode，避免默认版本过旧
          sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable & iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install frontend dependencies
        run: npm install

      - name: Init iOS project (if not already)
        run: npm run tauri ios init

      - name: Build iOS (archive only, unsigned)
        env:
          CI: "true"
        run: |
          # 使用 --archive-only 先归档，不尝试导出签名 IPA
          npm run tauri ios build -- --archive-only --no-sign --ci 2>&1 | tee build.log || {
            EXIT_CODE=$?
            # 检查是否仍生成了 .xcarchive/.app（有时归档会部分成功）
            APP_FOUND=$(find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_FOUND" ]; then
              echo "✅ 找到 .app 文件，继续手动打包"
              exit 0
            fi
            echo "❌ 归档阶段失败，且未生成 .app 文件"
            cat build.log
            exit $EXIT_CODE
          }

      - name: Package unsigned IPA
        run: |
          # 在 .xcarchive 或构建目录中寻找 .app
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app 文件，无法打包 IPA"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          chmod -R 755 Payload/
          chmod 644 Payload/*.app/Info.plist 2>/dev/null || true
          zip -r -q YourApp-unsigned.ipa Payload/
          echo "IPA 已生成：$(ls -lh YourApp-unsigned.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: YourApp-unsigned.ipa
          if-no-files-found: error